name: Build Ghostgram iOS IPA

on:
  push:
    branches: [codex/ghostgram-ios-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode_version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          xcodebuild -version
          df -h .

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Ghostgram/Features/Vless/Core/go/go.mod
          cache: false

      - name: Build the VPN core
        run: bash Ghostgram/Features/Vless/Core/build-core.sh

      - name: Build the IPA for Feather
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('build-system/appstore-configuration.json').read_text())
          config.update(bundle_id='org.ghostgram.sideload', is_appstore_build='false',
                        appstore_id='0', enable_siri=False, enable_icloud=False)
          Path('build-system/ghostgram-configuration.json').write_text(json.dumps(config))
          PY
          GG_PATCHES_ONLY=1 bash build-system/GGBuild.sh
          git -C build-system/bazel-rules/rules_apple apply \
            "$GITHUB_WORKSPACE/build-system/GGPatches/rules_apple-unsigned-ios.patch"
          cat >> build-system/GGXcode.bazelrc <<'BAZELRC'
          build --//Telegram:disableProvisioningProfiles
          build --features=disable_legacy_signing
          build --//Telegram:standaloneStorage
          BAZELRC
          python3 -u build-system/Make/Make.py --overrideXcodeVersion build \
            --configurationPath build-system/ghostgram-configuration.json \
            --xcodeManagedCodesigning \
            --configuration release_arm64 --buildNumber "$GITHUB_RUN_NUMBER"
          mkdir -p "$RUNNER_TEMP/ghostgram"
          ipa="$RUNNER_TEMP/ghostgram/Ghostgram-Feather.ipa"
          cp bazel-bin/Telegram/Telegram.ipa "$ipa"
          unzip -tq "$ipa"
          unzip -p "$ipa" Payload/Ghostgram.app/Info.plist > "$RUNNER_TEMP/Ghostgram-Info.plist"
          test "$(plutil -extract GhostgramStandaloneStorage raw "$RUNNER_TEMP/Ghostgram-Info.plist")" = true
          test "$(plutil -extract CFBundleIdentifier raw "$RUNNER_TEMP/Ghostgram-Info.plist")" = org.ghostgram.sideload
          unzip -Z1 "$ipa" > "$RUNNER_TEMP/ghostgram-contents.txt"
          grep -Fx 'Payload/Ghostgram.app/Ghostgram' "$RUNNER_TEMP/ghostgram-contents.txt"
          grep -Fx 'Payload/Ghostgram.app/Frameworks/GGXrayCore.framework/GGXrayCore' "$RUNNER_TEMP/ghostgram-contents.txt"
          if grep -Eq '/PlugIns/|/embedded\.mobileprovision$' "$RUNNER_TEMP/ghostgram-contents.txt"; then
            echo 'Unexpected extension or provisioning profile in the Feather IPA' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ghostgram-Feather
          path: ${{ runner.temp }}/ghostgram/Ghostgram-Feather.ipa
          if-no-files-found: error
          compression-level: 0
